name: CatPrinterIOS
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  CatPrinterIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CatPrinterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.efenow.catprinter.ios
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: CatPrinterIOS/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    resources:
      - ../www
    scheme:
      testTargets: []
